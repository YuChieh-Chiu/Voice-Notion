<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>授權回覆已處理 · Google Drive</title>
<style nonce="{{nonce}}">
:root{color-scheme:light;--canvas:#f7f5ee;--paper:#fffef9;--ink:#27392e;--muted:#59665d;--line:#e1e5d9;--green:#305e46;--mint:#dcebdc;--butter:#efda91;--lilac:#dfd5ed;--shadow:0 24px 70px #2b44300d}
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 5% 10%,#e5ebdc 0,transparent 40%),radial-gradient(ellipse at 98% 90%,#ece4f0 0,transparent 40%),var(--canvas);color:var(--ink);font:16px/1.65 ui-rounded,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;padding:28px 20px}
.shell{max-width:920px;margin:auto}.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:650;letter-spacing:.03em}.brand-mark{display:grid;place-items:center;width:32px;height:32px;background:var(--green);color:var(--paper);border-radius:11px}.brand-mark svg{width:20px;height:20px}
main{margin:44px 0 24px;border:1px solid var(--line);background:var(--paper);border-radius:30px;box-shadow:var(--shadow);padding:48px;position:relative}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;align-items:center}.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid #cadbc9;background:#eff5eb;color:#36553c;border-radius:99px;font-size:13px;font-weight:650}.pill-dot{width:7px;height:7px;border-radius:50%;background:#4d7952}
h1{font-size:clamp(30px,4.5vw,43px);line-height:1.38;letter-spacing:-.035em;margin:20px 0 16px;text-wrap:balance}h1 span{display:block}.intro{max-width:36ch;color:var(--muted);margin:0}.illustration{width:100%;max-width:310px;justify-self:center;overflow:visible}.paper-float{animation:float 5s ease-in-out infinite;transform-origin:center}@keyframes float{50%{transform:translateY(-5px) rotate(1deg)}}
.next{border-top:1px solid var(--line);margin-top:36px;padding-top:28px}h2{font-size:17px;letter-spacing:.01em;margin:0 0 16px}.steps{display:grid;grid-template-columns:1fr 1fr;gap:20px;list-style:none;padding:0;margin:0}.steps li{display:flex;align-items:flex-start;gap:12px}.number{flex-shrink:0;display:grid;place-items:center;width:30px;height:30px;background:#f0f0e6;border-radius:10px;font-size:13px;font-weight:750}.steps strong{font-size:15px}.steps p{font-size:14px;margin:4px 0 0;color:var(--muted)}
.actions{display:flex;align-items:center;gap:20px;margin-top:30px}.primary{min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:20px;padding:12px 22px;background:var(--green);color:#fff;text-decoration:none;border-radius:14px;font-size:15px;font-weight:650;transition:background .18s,transform .18s}.primary svg{width:18px;height:18px;transition:transform .18s}.primary:hover{background:#244d37}.primary:hover svg{transform:translateX(3px)}.primary:active{transform:translateY(1px)}a:focus-visible{outline:3px solid #776197;outline-offset:5px}.hint{font-size:13px;max-width:23ch;color:var(--muted);margin:0}.footer{text-align:center;font-size:13px;color:var(--muted);padding:0 10px}
@media(max-width:640px){body{padding:20px 16px}main{padding:28px 24px;border-radius:24px;margin-top:28px}.hero{grid-template-columns:1fr;gap:14px}.illustration{max-width:230px;margin:0 auto;grid-row:2}h1{font-size:31px}.intro{max-width:none}.next{margin-top:16px;padding-top:24px}.steps{grid-template-columns:1fr;gap:18px}.actions{align-items:stretch;flex-direction:column;gap:12px;margin-top:24px}.hint{max-width:none;text-align:center}.primary{width:100%}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
