<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>連接 Google Drive</title>
<style nonce="{{nonce}}">
:root{color-scheme:dark;--bg:#0f172a;--card:#1e293b;--text:#f8fafc;--muted:#cbd5e1;--accent:#22c55e;--error:#fda4af}
*{box-sizing:border-box}body{margin:0;padding:32px 20px;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,sans-serif}
main{max-width:560px;margin:32px auto;padding:24px;background:var(--card);border-radius:16px}
h1{font-size:1.65rem;margin-top:0}p{color:var(--muted)}label{display:block;margin-top:20px;font-weight:600}
input,button{width:100%;min-height:48px;border-radius:8px;font:inherit;padding:10px 12px}
input{margin-top:8px;color:var(--text);background:var(--bg);border:1px solid #94a3b8}
button{margin-top:16px;border:0;background:var(--accent);color:#0f172a;font-weight:700;cursor:pointer}
button.secondary{background:var(--bg);color:var(--text);border:1px solid #94a3b8}
button:active{opacity:.8}button:disabled{opacity:.55;cursor:wait}:focus-visible{outline:3px solid #a5b4fc;outline-offset:3px}
#error{color:var(--error);overflow-wrap:anywhere}#status{overflow-wrap:anywhere}small{display:block;color:var(--muted);margin-top:8px}
</style>
<main>
<h1>連接 Google Drive</h1>
<p>以部署者身分授權，建立專用私人資料夾。重新授權會沿用原帳號與資料夾。</p>
<div id="error" role="alert" tabindex="-1"></div>
<form id="connection">
<label for="key">部署者管理金鑰</label>
<input id="key" type="password" autocomplete="current-password" required aria-describedby="key-help">
<small id="key-help">金鑰只用於本次操作，不儲存至瀏覽器。</small>
<label for="root">新資料夾名稱</label>
<input id="root" value="Voice-Notion-UAT" required maxlength="100">
<button type="submit">前往 Google 授權</button>
<button type="button" class="secondary" id="check">查看連接狀態</button>
<button type="button" class="secondary" id="retry">重試完成資料夾設定</button>
</form>
<p id="status" role="status" aria-live="polite"></p>
</main>
<script nonce="{{nonce}}">
const form=document.getElementById('connection'),key=document.getElementById('key'),error=document.getElementById('error'),status=document.getElementById('status');
async function operation(path,method,body){
  if(!form.reportValidity())return;
  error.textContent='';status.textContent='正在處理…';
  const secret=key.value;for(const button of form.querySelectorAll('button'))button.disabled=true;
  try{
    const response=await fetch('/oauth/google/'+path,{method,credentials:'same-origin',headers:{'X-API-Key':secret,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});
    const result=await response.json();
    if(!response.ok)throw new Error(response.status===401?'管理金鑰不正確。':response.status===409?'請保留原帳號與用戶端；若有待完成的連接，請按「重試完成資料夾設定」。':'連接尚未完成，請確認設定後再試。');
    if(result.authorization_url){window.location.assign(result.authorization_url);return;}
    status.textContent=result.connected?'已連接：'+result.email+'；資料夾：'+result.folder_url:result.pending?'Google 已授權，資料夾尚待完成，請按重試。':'尚未連接，請先完成 Google 授權。';
  }catch(problem){status.textContent='';error.textContent=problem.message;error.focus();}
  finally{key.value='';for(const button of form.querySelectorAll('button'))button.disabled=false;}
}
form.addEventListener('submit',event=>{event.preventDefault();operation('start','POST',{root_name:document.getElementById('root').value.trim()});});
document.getElementById('check').addEventListener('click',()=>operation('status','GET'));
document.getElementById('retry').addEventListener('click',()=>operation('finish','POST'));
</script>
</html>
